---
- name: "sec02 | sec02-main | Check OS family"
  ansible.builtin.fail:
    msg: "This role can only be run against Ubuntu. {{ ansible_facts.distribution }} is not supported."
  when:
    - ansible_facts.distribution != 'Ubuntu'
  tags:
    - always

- name: "sec02 | sec02-main | Check OS version and family"
  ansible.builtin.fail:
    msg: "This role can only be run against Ubuntu 24. {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }} is not supported."
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version is version_compare('24', '!=')
  tags:
    - always

- name: "sec02 | sec02-main | Import subsection 01 - Configure Server Services"
  ansible.builtin.import_tasks:
    file: sec02/sec02-01.yml
  when: hardening_sec02_01
  tags:
    - always

- name: "sec02 | sec02-main | Import subsection 02 - Configure Client Services"
  ansible.builtin.import_tasks:
    file: sec02/sec02-02.yml
  when: hardening_sec02_02
  tags:
    - always

- name: "sec02 | sec02-main | Import subsection 03 - Configure Time Synchronization"
  ansible.builtin.import_tasks:
    file: sec02/sec02-03.yml
  when: hardening_sec02_03
  tags:
    - always

- name: "sec02 | sec02-main | Import subsection 04 - Job Schedulers"
  ansible.builtin.import_tasks:
    file: sec02/sec02-04.yml
  when: hardening_sec02_04
  tags:
    - always

...
