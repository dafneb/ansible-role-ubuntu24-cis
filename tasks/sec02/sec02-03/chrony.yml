---
- name: "sec02-03 | chrony | Stop systemd-timesyncd"
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
    masked: true
  tags:
    - always

- name: "sec02-03 | chrony | Run update_cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ hardening_updates_cache_valid_time }}"
  when: not hardening_sec01_02
  tags:
    - always

- name: "sec02-03 | chrony | Install chrony package"
  ansible.builtin.apt:
    name: "chrony"
    state: present
  tags:
    - always

- name: "sec02-03 | chrony | Create target folder ({{ hardening_time_chrony_path | dirname }})"
  ansible.builtin.file:
    path: "{{ hardening_time_chrony_path | dirname }}"
    state: directory
    mode: '0755'
  tags:
    - always

- name: "sec02-03 | chrony | Apply NTP settings ({{ hardening_time_chrony_path }})"
  ansible.builtin.template:
    src: sec02/sec02-03/chrony.conf.j2
    dest: "{{ hardening_time_chrony_path }}"
    mode: '0644'
    owner: root
    group: root
  notify:
    - Restart chronyd service
    - Restart cron service
    - Restart systemd-journald service
  tags:
    - always

...
