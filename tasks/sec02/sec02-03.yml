---
- name: "sec02 | sec02-03 | Check OS family"
  ansible.builtin.fail:
    msg: "This role can only be run against Ubuntu. {{ ansible_facts.distribution }} is not supported."
  when:
    - ansible_facts.distribution != 'Ubuntu'
  tags:
    - always

- name: "sec02 | sec02-03 | Check OS version and family"
  ansible.builtin.fail:
    msg: "This role can only be run against Ubuntu 24. {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }} is not supported."
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version is version_compare('24', '!=')
  tags:
    - always

- name: "sec02 | sec02-03 | Install required package util-linux-extra"
  ansible.builtin.apt:
    name: "util-linux-extra"
    state: present
  tags:
    - always

- name: "sec02 | sec02-03 | Change time zone"
  community.general.timezone:
    name: "{{ hardening_time_timezone }}"
  notify:
    - Restart cron service
  tags:
    - always

- name: "sec02 | sec02-03 | Import tasks for timesyncd daemon"
  ansible.builtin.import_tasks:
    file: sec02/sec02-03/timesyncd.yml
  when: hardening_time_timesyncd_daemon
  tags:
    - always

- name: "sec02 | sec02-03 | Import tasks for chrony daemon"
  ansible.builtin.import_tasks:
    file: sec02/sec02-03/chrony.yml
  when:
    - not hardening_time_timesyncd_daemon
    - hardening_time_chrony_daemon
  tags:
    - always

...
