---
- name: "sec06 | sec06-01 | Check OS family"
  ansible.builtin.fail:
    msg: "This role can only be run against Ubuntu. {{ ansible_facts.distribution }} is not supported."
  when:
    - ansible_facts.distribution != 'Ubuntu'
  tags:
    - always

- name: "sec06 | sec06-01 | Check OS version and family"
  ansible.builtin.fail:
    msg: "This role can only be run against Ubuntu 24. {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }} is not supported."
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version is version_compare('24', '!=')
  tags:
    - always

- name: "sec06 | sec06-01 | Enable and activate service systemd-journald"
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: started
    enabled: true
    masked: false
  tags:
    - always

- name: "sec06 | sec06-01 | Settings access for journald log file"
  ansible.builtin.template:
    src: sec06/sec06-01/systemd.conf.j2
    dest: /etc/tmpfiles.d/systemd.conf
    mode: '0644'
    owner: root
    group: root
  notify: Reload systemd-journald.service
  tags:
    - always

- name: "sec06 | sec06-01 | Settings for systemd-journald (default)"
  ansible.builtin.template:
    src: sec06/sec06-01/journald.conf.j2
    dest: /etc/systemd/journald.conf
    mode: '0644'
    owner: root
    group: root
  notify: Reload systemd-journald.service
  tags:
    - always

- name: "sec06 | sec06-01 | Settings for systemd-journald (file rotation)"
  ansible.builtin.template:
    src: sec06/sec06-01/60-journald-rotation.conf.j2
    dest: /etc/systemd/journald.conf.d/60-rotation.conf
    mode: '0644'
    owner: root
    group: root
  notify: Reload systemd-journald.service
  tags:
    - always

- name: "sec06 | sec06-01 | Settings for systemd-journald (advanced)"
  ansible.builtin.template:
    src: sec06/sec06-01/60-journald-advanced.conf.j2
    dest: /etc/systemd/journald.conf.d/60-advanced.conf
    mode: '0644'
    owner: root
    group: root
  notify: Reload systemd-journald.service
  tags:
    - always

- name: "sec06 | sec06-01 | Import tasks for systemd-journald-remote"
  ansible.builtin.import_tasks:
    file: sec06/sec06-01/systemd-journal-upload.yml
  when:
    - hardening_logging_journal_remote
  tags:
    - always

- name: "sec06 | sec06-01 | Import tasks for rsyslog"
  ansible.builtin.import_tasks:
    file: sec06/sec06-01/rsyslog.yml
  when:
    - not hardening_logging_journal_remote
    - hardening_logging_rsyslog
  tags:
    - always

...
