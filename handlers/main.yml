---
# handlers file for ubuntu24-cis
- name: Restart cron service
  ansible.builtin.systemd_service:
    name: cron
    state: restarted
    enabled: true
    masked: false
  tags:
    - always

- name: Restart systemd-timesyncd service
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted
    enabled: true
    masked: false
  tags:
    - always

- name: Restart systemd-journald service
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
    enabled: true
    masked: false
  tags:
    - always

- name: Restart chronyd service
  ansible.builtin.systemd_service:
    name: chronyd
    state: restarted
    enabled: true
    masked: false
  tags:
    - always

...
