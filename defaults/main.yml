---
# defaults file for ubuntu24-cis

## --------------------------------------------------------
## Section: Common settings
#
# Select which section should be applied

## Section: 01 Initial Setup
hardening_sec01: true
## Section: 02 Services
hardening_sec02: true
## Section: 03 Network
hardening_sec03: true
## Section: 04 Host Based Firewall
hardening_sec04: true
## Section: 05 Access Control
hardening_sec05: true
## Section: 06 Logging and auditing
hardening_sec06: true
## Section: 07 System Maintenance
hardening_sec07: true

# Some common settings
hardening_ansible_console_ip: []
hardening_admin_device_ip: []

## --------------------------------------------------------

## --------------------------------------------------------
## Section: 01 Initial Setup
#
# Select which subsection should be applied
# and also included settings.

## 1.1 Filesystem
hardening_sec01_01: true

## 1.2 Package Management
hardening_sec01_02: true

# Settings for update and upgrade
hardening_updates_cache_valid_time: 3600
hardening_upgrade_installed_packages: true
hardening_updates_autoremove_purge: true

## 1.3 Mandatory Access Control (MAC)
hardening_sec01_03: true

# AppArmor required packages
hardening_apparmor_packages:
  - apparmor
  - apparmor-utils

# Select mode for AppArmor
# true: complaint mode
# false: enforce mode
hardening_apparmor_complaint_mode: true

## 1.4 Configure Bootloader
hardening_sec01_04: true

## 1.5 Configure Additional Process Hardening
hardening_sec01_05: true

## 1.6 Configure Command Line Warning Banners
hardening_sec01_06: true
# Message of the day
hardening_motd_msg: "He's dead, Dave, everybody is dead, everybody is dead, Dave."
hardening_motd_path: /etc/motd
hardening_motd_dynamic_erase: true
hardening_motd_dynamic_path: /etc/update-motd.d
# Login warning
hardening_issue_msg: "Authorized users only. All activity may be monitored and reported."
hardening_local_issue_path: /etc/issue
hardening_remote_issue_path: /etc/issue.net

## 1.7 Configure GNOME Display Manager
hardening_sec01_07: true

## --------------------------------------------------------

## --------------------------------------------------------
## Section: 02 Services
#
# Select which subsection should be applied
# and also included settings.

## 2.1 Configure Server Services
hardening_sec02_01: true
# Define which services should be stopped and masked
hardening_stop_service:
  - autofs.service
  - avahi-daemon.socket
  - avahi-daemon.service
  - isc-dhcp-server.service
  - isc-dhcp-server6.service
  - named.service
  - dnsmasq.service
  - vsftpd.service
  - slapd.service
  - dovecot.socket
  - dovecot.service
  - nfs-server.service
  - ypserv.service
  - cups.socket
  - cups.service
  - rpcbind.socket
  - rpcbind.service
  - rsync.service
  - smbd.service
  - snmpd.service
  - tftpd-hpa.service
  - squid.service
  - apache2.socket
  - apache2.service
  - nginx.service
  - xinetd.service
# Define which packages should be purged from system
# Warning: This array is empty due to risk of unsuspected behavior
hardening_purge_package: []
hardening_mta_local_only: true

## 2.2 Configure Client Services
hardening_sec02_02: true
# Define which packages should be purged from system
hardening_purge_client_package:
  - nis
  - rsh-client
  - talk
  - telnet
  - inetutils-telnet
  - ldap-utils
  - ftp
  - tnftp

## 2.3 Configure Time Synchronization
hardening_sec02_03: true
# Timezone (get your value from 'timedatectl list-timezones')
hardening_time_timezone: Europe/Prague
# Choose which daemon will be used for time synchronization
# Warning: If you will choose chrony and forgot deny timesyncd, then timesyncd has got priority
hardening_time_timesyncd_daemon: true
hardening_time_timesyncd_path: /etc/systemd/timesyncd.conf.d/60-timesyncd.conf
hardening_time_chrony_daemon: false
hardening_time_chrony_path: /etc/chrony/sources.d/60-sources.sources
# Definition of primary NTP servers
hardening_time_primary_ntps:
  - 0.cz.pool.ntp.org
  - 1.cz.pool.ntp.org
  - 2.cz.pool.ntp.org
  - 3.cz.pool.ntp.org
# Definition of fallback NTP servers
hardening_time_fallback_ntps:
  - time-a-g.nist.gov
  - time-b-g.nist.gov
  - time-c-g.nist.gov
  - time-d-g.nist.gov
  - time-e-g.nist.gov

## 2.4 Job Schedulers
hardening_sec02_04: true

# Cron settings - cron.allow
# If hardening_cron_allow_list is true, then file cron.allow is created.
# If hardening_cron_allow_list is false, then file cron.allow is removed.
hardening_cron_allow_list: true
hardening_cron_users_allow_list:
  - root
# Cron settings - cron.deny
# If hardening_cron_deny_list is true, then file cron.deny is created.
# If hardening_cron_deny_list is false, then file cron.deny is removed.
hardening_cron_deny_list: false
hardening_cron_users_deny_list: []

# At settings - installation / purging of "at" package
hardening_install_at: false
# Cron settings - cron.allow
# If hardening_at_allow_list is true, then file cron.allow is created.
# If hardening_at_allow_list is false, then file cron.allow is removed.
hardening_at_allow_list: false
hardening_at_users_allow_list: []
# Cron settings - cron.deny
# If hardening_at_deny_list is true, then file cron.deny is created.
# If hardening_at_deny_list is false, then file cron.deny is removed.
hardening_at_deny_list: false
hardening_at_users_deny_list: []

## --------------------------------------------------------

## --------------------------------------------------------
## Section: 03 Network
#
# Select which subsection should be applied
# and also included settings.

## 3.1 Configure Network Devices
hardening_sec03_01: true

# Disable IPv6
hardening_disable_ipv6: true
hardening_disable_ipv6_conf_path: /etc/sysctl.d/10-ipv6-disabling.conf

# Disable wireless connection
hardening_disable_wifi: false

# Disable bluetooth connection
hardening_disable_bluetooth: false

## 3.2 Configure Network Kernel Modules
hardening_sec03_02: true

## 3.3 Configure Network Kernel Parameters
hardening_sec03_03: true

## --------------------------------------------------------

## --------------------------------------------------------
## Section: 04 Host Based Firewall
#
# Select which subsection should be applied
# and also included settings.

## 4.2 Configure UFW
hardening_sec04_02: true

## 4.3 Configure nftables
hardening_sec04_03: false

## 4.4 Configure iptables
hardening_sec04_04: false

## --------------------------------------------------------

## --------------------------------------------------------
## Section: 05 Access Control
#
# Select which subsection should be applied
# and also included settings.

## 5.1 Configure SSH Server
hardening_sec05_01: true
hardening_ssh_allow_users:
  - ansible
hardening_ssh_allow_groups:
hardening_ssh_deny_users:
hardening_ssh_deny_groups:

## 5.2 Configure privilege escalation
hardening_sec05_02: true

## 5.3 Pluggable Authentication Modules
hardening_sec05_03: true

## 5.4 User Accounts and Environment
hardening_sec05_04: true

## --------------------------------------------------------

## --------------------------------------------------------
## Section: 06 Logging and Auditing
#
# Select which subsection should be applied
# and also included settings.

## 6.1 System Logging
hardening_sec06_01: true

# Settings for systemd-journald - rotation
hardening_sysjournald_systemmaxuse: "1G"
hardening_sysjournald_systemkeepfree: "500M"
hardening_sysjournald_runtimemaxuse: "200M"
hardening_sysjournald_runtimekeepfree: "50M"
hardening_sysjournald_maxfilesec: "1month"
# Settings for systemd-journald - advanced
hardening_sysjournald_forwardtosyslog: "yes"
hardening_sysjournald_compress: "yes"
hardening_sysjournald_storage: "persistent"

# Settings for logging
# If true systemd-journal-upload will be used for log sending (this option has got priority)
hardening_logging_journal_upload: false
hardening_journal_upload_packages:
  - systemd-journal-remote
hardening_journal_upload_url: "127.0.0.1"
hardening_journal_upload_serverkey: "/path/to/key/server.key"
hardening_journal_upload_servercert: "/path/to/cert/server.cert"
hardening_journal_upload_trustedcert: "/path/to/cert/trusted.cert"
hardening_journal_upload_timeout: "3min"

# IMPORTANT: If rsyslog is used for collect clients log, then
# hardening_sysjournald_forwardtosyslog has to be "yes"
hardening_logging_rsyslog: true
hardening_rsyslog_packages:
  - rsyslog
# If true rsyslog will be used for log sending
hardening_rsyslog_upload: false
hardening_rsyslog_target: "127.0.0.1"
hardening_rsyslog_port: 514
hardening_rsyslog_protocol: "tcp"
hardening_rsyslog_resumeretry: 100
hardening_rsyslog_saveonshutdown: "on"
hardening_rsyslog_maxdiskspace: "1g"
# Here you can define path to additional *.conf files for your rsyslog
# Files from here will be added to /etc/rsyslog.d folder via copy module
hardening_rsyslog_additional_settings: []

## 6.2 System Auditing
hardening_sec06_02: true

# Auditd service
hardening_auditd_packages:
  - auditd
  - audispd-plugins
hardening_auditd_backlog: 8192
hardening_auditd_maxlogfile: 25
hardening_auditd_maxlogfileaction: "keep_logs"
hardening_auditd_diskfullaction: "single"
hardening_auditd_diskerroraction: "single"
hardening_auditd_spaceleft: 75
hardening_auditd_spaceleftaction: "syslog"
hardening_auditd_adminspaceleft: 50
hardening_auditd_adminspaceleftaction: "single"

## 6.3 Configure Integrity Checking
hardening_sec06_03: true

## --------------------------------------------------------

## --------------------------------------------------------
## Section: 07 System Maintenance
#
# Select which subsection should be applied
# and also included settings.

## 7.1 System File Permissions
hardening_sec07_01: true

## 7.2 Local User and Group Settings
hardening_sec07_02: true

